name: glowhaus_ui
description: Glowhaus design system. Tokens, themes and components.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    # Loaded on demand the first time Persian is used.
    - assets/fonts/Vazirmatn-Variable.ttf
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
