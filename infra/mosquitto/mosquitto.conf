# Mosquitto 2 for Glowhaus. See infra/README.md and docs/protocol.md §12.
#
# Only what is in this file and in conf.d/ is on. Plain MQTT on 1883 is for
# the compose network (the simulator) and for the host's loopback only:
# docker-compose publishes it on 127.0.0.1. TLS (8883) and WSS (8884) come
# from conf.d/tls.conf, which scripts/make-certs.sh writes.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# No anonymous clients. Every client is one identity in passwd and acl.conf.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf

listener 1883
protocol mqtt

include_dir /mosquitto/config/conf.d
