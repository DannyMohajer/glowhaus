# Mosquitto ACL for Glowhaus (docs/protocol.md §12).
#
# Nothing is allowed unless a line below allows it. Identity is the username:
#
#   <homeId>.app          the app: everything under its own home, nothing else
#   <homeId>.<deviceId>   one device: writes only its own state, ack,
#                         availability and info, reads only its own set,
#                         and shares the home's discovery topic
#
# A device cannot read another device's commands, cannot forge another
# device's state, acks or info, and cannot reach another home. The last will
# is checked against these rules when the broker would publish it: a will on
# any topic but the device's own availability is never published.
#
# scripts/make-users.sh creates a password for every `user` line here and
# can append a block for another home.

# ---- home: demo-home ----

user demo-home.app
topic readwrite glowhaus/demo-home/#

user demo-home.lr-ceiling
topic write glowhaus/demo-home/lr-ceiling/state
topic write glowhaus/demo-home/lr-ceiling/ack
topic write glowhaus/demo-home/lr-ceiling/availability
topic write glowhaus/demo-home/lr-ceiling/info
topic read glowhaus/demo-home/lr-ceiling/set
topic readwrite glowhaus/demo-home/discovery

