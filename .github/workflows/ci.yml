name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

# Actions are on their Node 24 majors. Linux jobs are pinned to Ubuntu 24.04
# so the ubuntu-latest move cannot change the build underneath us.

jobs:
  analyze:
    name: Analyze, format, codegen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # Generated code is committed. Regenerate it and fail if anything
      # changed, so a stale freezed/json/injectable/l10n file cannot merge.
      - name: Codegen is up to date
        run: |
          dart run melos run codegen
          (cd apps/glowhaus && flutter gen-l10n)
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are out of date. Run 'dart run melos run codegen' and 'flutter gen-l10n', then commit."
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi

      - name: Format
        run: dart run melos run format
      - name: Analyze (zero warnings, zero infos)
        run: dart run melos run analyze

  test:
    name: Test (all packages, goldens)
    # Goldens are rendered on macOS (real font rasterization differs per OS).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run melos run test
      - name: Keep golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: '**/test/**/failures/'
          if-no-files-found: ignore

  build-web:
    name: Build web (app + Widgetbook)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Served from https://<owner>.github.io/<repo>/, Widgetbook at /widgetbook/.
      - run: tool/build_web.sh "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: apps/glowhaus

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [analyze, test, build-web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
