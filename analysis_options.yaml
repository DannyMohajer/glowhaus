include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    # freezed puts @JsonKey on factory parameters.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "**/l10n/generated/**"

linter:
  rules:
    # App and internal packages, not published API docs.
    public_member_api_docs: false
