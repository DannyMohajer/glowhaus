<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Glowhaus: an open-source smart home demo built with Flutter. Every device is simulated in your browser.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F1F1EF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Glowhaus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Glowhaus</title>

  <!-- Shown until the first Flutter frame replaces it. Pure CSS, no assets. -->
  <style>
    html, body { margin: 0; height: 100%; background: #F1F1EF; }
    @media (prefers-color-scheme: dark) { html, body { background: #111111; } }
    #glow-loading {
      position: fixed; inset: 0; display: grid; place-items: center;
    }
    #glow-loading span {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid rgba(255, 90, 31, 0.25); border-top-color: #FF5A1F;
      animation: glow-spin 0.9s linear infinite;
    }
    @keyframes glow-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #glow-loading span { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="glow-loading" role="progressbar" aria-label="Loading Glowhaus"><span></span></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
